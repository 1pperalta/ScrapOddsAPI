services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: betting_odds_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oddsupb}
      POSTGRES_DB: ${DB_NAME:-betting_odds}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Flask/Python)
  backend:
    build:
      context: ./odds-agent/backend/server_py
      dockerfile: dockerfile
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (React build served by Nginx)
  frontend:
    build:
      context: ./odds-agent/frontend
      dockerfile: dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Scraper job (one-off execution)
  scraper:
    build:
      context: ./scrapping
      dockerfile: dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: