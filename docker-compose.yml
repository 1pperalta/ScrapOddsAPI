services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: betting_odds_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oddsupb}
      POSTGRES_DB: ${DB_NAME:-betting_odds}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Flask/Python)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: betting_odds_backend
    command: ["uv", "run", "python", "odds-agent/backend/server_py/app.py"]
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PORT: 5000
      PYTHONUNBUFFERED: 1
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./scrapping/data:/app/scrapping/data
      - ./odds-agent/backend/server_py:/app/odds-agent/backend/server_py
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Scraper job (Continuous or scheduled)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: betting_odds_scraper
    # Runs the initial scrape and context builder, then sleeps for a day, and loops
    command: >
      bash -c "while true; do
      uv run python scrapping/odds_scraper.py;
      uv run python scrapping/update_context.py;
      echo 'Scraping done, sleeping for 24 hours...';
      sleep 86400;
      done"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PYTHONUNBUFFERED: 1
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./scrapping/data:/app/scrapping/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (React build served by Nginx)
  frontend:
    build:
      context: ./odds-agent/frontend
      dockerfile: dockerfile
    container_name: betting_odds_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: