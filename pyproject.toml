[project]
name = "scrapoddsapi"
version = "1.0.0"
description = "Sports betting odds analysis platform with LangGraph AI agent"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "flask",
    "flask-cors",

    # LangGraph Agent
    "langgraph",
    "langchain-openai",
    "langchain-core",

    # Database
    "psycopg2-binary",

    # HTTP & Data
    "httpx",
    "numpy",
    "pandas",

    # Utils
    "python-dotenv",

    # RAG
    "chromadb",
    "sentence-transformers",
]
